<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sukiyaki Ordering</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Sukiyaki House</h1>
    <p>Order from your table</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="menu-heading">
      <h2 id="menu-heading">Menu</h2>
      <div id="menu" class="menu"></div>
    </section>

    <section class="panel" aria-labelledby="order-heading">
      <h2 id="order-heading">Your Order</h2>

      <div class="table-field">
        <label for="table-number">Table number</label>
        <input id="table-number" type="number" min="1" step="1" placeholder="e.g. 5">
        <p id="table-error" class="error" role="alert"></p>
      </div>

      <div id="cart" class="cart"></div>

      <div class="total-row">
        <span>Total</span>
        <span id="total">฿0</span>
      </div>

      <button id="confirm-btn" type="button" disabled>Confirm order</button>
    </section>
  </main>

  <section id="summary" class="panel summary hidden" aria-labelledby="summary-heading">
    <h2 id="summary-heading">Order Summary</h2>
    <div id="summary-body"></div>
    <button id="reset-btn" type="button">New order</button>
  </section>

  <script src="app.js" defer></script>
</body>
</html>
